# 4 luồng 1080p CÓ ReID, detector PeopleNet Transformer v2 (DINO + FAN-Small) — đo FPS phiên 30
# (docs/worklog/2026-09-28-30-*). Chỉ khác streams_reid.yaml (YOLO11s b4) ở mục `pgie`
# (có test canh), nên chênh FPS giữa hai file là chi phí thật của detector.
#
# Engine batch 7 của config nvinfer dùng được luôn cho 4 luồng: nvinfer chỉ build lại khi
# engine có maxBatch NHỎ HƠN batch được yêu cầu.
sources:
  - cam_id: cam01
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
  - cam_id: cam02
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
  - cam_id: cam03
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
  - cam_id: cam04
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4

streammux:
  width: 1920
  height: 1080
  batched_push_timeout_us: 40000
  live_source: false
  attach_sys_ts: true

tracker:
  ll_lib_file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  ll_config_file: configs/pipeline/config_tracker_NvDCF_reid.yml
  width: 960
  height: 544
  display_tracking_id: false

sink:
  # false = chạy hết tốc lực (đo FPS). true = phát đúng tốc độ thật — bắt buộc khi GHI
  # FIXTURE từ nguồn file, nếu không cả đoạn video bị nén vào vài giây ts_ms và ràng
  # buộc thời gian di chuyển (src/mct/topology.py) mất ý nghĩa. Đo 2026-09-04: chạy hết
  # tốc lực thì 853 frame trải đúng 4.7 s thay vì ~48 s.
  sync: false

pgie:
  config_file: configs/pipeline/config_infer_peoplenet_transformer_v2.txt
  # Labels BG, Person, Face, Bag -> người là lớp 1 (YOLO là 0).
  person_class_id: 1
