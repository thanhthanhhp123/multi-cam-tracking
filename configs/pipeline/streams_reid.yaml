# Cấu hình 4 luồng CÓ ReID — M3. Cặp đối chứng của streams_multi.yaml.
#
# Hai file này CHỈ khác nhau ở `tracker.ll_config_file`. Giữ đúng như vậy: chênh lệch
# FPS đo được giữa chúng là chi phí thật của ReID, không lẫn biến nào khác. Sửa nguồn,
# streammux hay pgie ở một file thì phải sửa cả file kia (có test canh).
#
# Chạy để GHI FIXTURE THẬT (mục tiêu chính của M3) thì phải đổi `sink.sync` sang true —
# xem chú thích ở khối sink bên dưới.
sources:
  - cam_id: cam01
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
  - cam_id: cam02
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
  - cam_id: cam03
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
  - cam_id: cam04
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4

streammux:
  width: 1920
  height: 1080
  batched_push_timeout_us: 40000
  live_source: false
  attach_sys_ts: true

tracker:
  ll_lib_file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  ll_config_file: configs/pipeline/config_tracker_NvDCF_reid.yml
  width: 960
  height: 544
  display_tracking_id: false

sink:
  # false = chạy hết tốc lực (đo FPS). true = phát đúng tốc độ thật — bắt buộc khi GHI
  # FIXTURE từ nguồn file, nếu không cả đoạn video bị nén vào vài giây ts_ms và ràng
  # buộc thời gian di chuyển (src/mct/topology.py) mất ý nghĩa. Đo 2026-09-04: chạy hết
  # tốc lực thì 853 frame trải đúng 4.7 s thay vì ~48 s.
  sync: false

pgie:
  config_file: configs/pipeline/config_infer_yolo11_b4.txt
