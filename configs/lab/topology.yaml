# Topology của bố trí camera TỰ THU (M6) — đề cương mục 4.2 + 4.3.2 bước 1.
#
# ĐÂY LÀ BẢN MẪU. `status: template` làm `python -m tools.check_lab_setup` báo FAIL cho tới
# khi mọi số dưới đây được đo thật và đổi thành `status: measured`. Quy trình đo và bố trí:
# docs/m6/README.md.
#
# Bố trí với 3 camera IP (từ 2026-10-12; đề cương mục 4.2: một cặp chồng lấn + camera còn
# lại không chồng lấn):
#
#     ┌──────── khu A (sảnh/phòng) ────────┐          lối đi / hành lang
#     │  cam01 ◣              ◢ cam02      │  ~8–15 m  ──────────  cam03
#     │      vùng sàn chung ~4 × 6 m       │
#     └────────────────────────────────────┘
#
#  - cam01, cam02: nhìn CHUNG một vùng sàn từ hai góc → liên kết bằng homography
#    (kịch bản 1 của đề cương mục 6.2).
#  - cam03: không thấy khu A → liên kết bằng ngoại hình + thời gian di chuyển (kịch bản 2).
#    Đi A → cam03 → A → cam03 còn cho cả loại "quay lại cùng camera".
#  - Cả ba loại cặp nằm trong CÙNG một buổi quay — đúng cấu hình hỗn hợp mà đồ án nhắm tới.
#  - MỌI camera hiệu chỉnh về CÙNG một hệ toạ độ sàn (một gốc, đo bằng thước) — kể cả
#    cam03: `same_camera_stitch` cần homography của chính camera đó để nối mảnh
#    tracklet (+27% AssA trên WildTrack, phiên 18), và HomographyMapper chỉ nạp các camera
#    cùng một `plane`.
#
# Số transit dưới đây là CHỖ GIỮ CHỖ. Lấy số thật bằng:
#   python -m tools.estimate_transit --gt-fixture <fixture GT của đoạn HIỆU CHỈNH> \
#       --topology configs/lab/topology.yaml --yaml-out data/lab/transitions.suggest.yaml
# trên một đoạn quay riêng (không phải đoạn dùng để chấm điểm — xem docstring công cụ đó).

status: template

cameras:
  cam01:
    name: "Khu A - góc trái"
    resolution: [1920, 1080]
    fps: 25
    overlaps_with: [cam02]
  cam02:
    name: "Khu A - góc phải"
    resolution: [1920, 1080]
    fps: 25
    overlaps_with: [cam01]
  cam03:
    name: "Lối đi"
    resolution: [1920, 1080]
    fps: 25
    overlaps_with: []

# `allow` cho tới khi đã đo đủ mọi cặp; sau đó đổi `reject` để topology là bộ lọc thật.
unknown_pair_policy: allow

transitions:
  # Ra khỏi khu A (thấy lần cuối ở cam01 HOẶC cam02) rồi hiện ở cam03.
  # distance_m đo 2026-10-17 trên hệ toạ độ sàn của configs/lab/ground_points.yaml (hành lang
  # thẳng, x dọc hành lang): vùng sàn cam03 bắt đầu ở x = 18.4 m (27 viên, thước dây); cam02
  # thấy sàn tới x ~ 2.0 m. cam01 nhìn dọc hành lang thấy tới tận vùng cam03 (x = 18.4 m rơi
  # vào pixel ~(561, 418)) — 12.4 m ở dưới giả định cam01 bị cắt ở x <= 6 m (ROI, CHƯA LÀM).
  - from: cam01
    to: cam03
    bidirectional: true
    min_ms: 3000      # GIỮ CHỖ — đo bằng buổi calib
    max_ms: 30000     # GIỮ CHỖ — đo bằng buổi calib
    distance_m: 12.4
  - from: cam02
    to: cam03
    bidirectional: true
    min_ms: 3000      # GIỮ CHỖ — đo bằng buổi calib
    max_ms: 30000     # GIỮ CHỖ — đo bằng buổi calib
    distance_m: 16.4

homography: {}
