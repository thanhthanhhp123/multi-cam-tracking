# ByteTrack cho tools.prelabel_cvat (gán nhãn trước cho CVAT, KHÔNG dùng trong pipeline).
# Khoá theo cfg/trackers/bytetrack.yaml của ultralytics 8.4.7; chỉ đổi những dòng có ghi chú.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
# Mặc định 30 khung = 1.2 s ở 25 fps: người bị che ngắn (đi ngang nhau ở s3) là đứt track.
# 75 khung = 3 s. Đứt track thì người gán nhãn phải điền person_id cho thêm một mảnh.
track_buffer: 75
match_thresh: 0.8
fuse_score: True
