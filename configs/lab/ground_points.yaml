# Cặp điểm ảnh ↔ sàn để hiệu chỉnh homography các camera TỰ THU (M6).
#
# Đo 2026-10-17, hành lang tầng (sàn gạch caro; một viên 67 cm, nhưng BƯỚC LƯỚI
# kể cả ron = 18.4 m / 27 viên = 0.6815 m, người dùng đo bằng thước từ hộp tới túi đỏ — dùng số này).
# Điểm ảnh = GIAO ĐIỂM ĐƯỜNG RON GẠCH, không click tay:
#   - khung trung vị 30 ảnh / 20 s từ RTSP luồng chính 1920x1080 (xoá người đi qua),
#     data/lab/calib_frames/r2/camXX_median.png. Video đồng bộ (tools.sync_recordings) giữ
#     nguyên 1920x1080 nên toạ độ pixel dùng thẳng được.
#   - Canny + HoughLinesP trong đa giác sàn, gom đoạn thành đường ron, khớp đường bằng bình
#     phương tối thiểu toàn phần, rồi lấy giao điểm hai họ đường (ngang x dọc).
#   - Fit thử trên lưới viên gạch: sai số chiếu trung vị 1.0 cm, lớn nhất 4.1 cm (cam01)
#     và 2.3 cm (cam02). Các đường ron khác rơi đúng số nguyên viên (lệch <= 0.05 viên).
# Nối lưới hai camera bằng 5 đồ vật đặt trên sàn (hộp, ba lô, túi đỏ, cặp nằm, quần), cùng
# một quan hệ cho cả 5: hàng(cam02) = 9 - hàng(cam01), cột(cam02) = 1 - cột(cam01), lệch
# <= 0.15 viên.
#
# HỆ TOẠ ĐỘ SÀN (mét), dùng chung cho mọi camera:
#   gốc (0, 0) = góc gạch ngay cạnh cái HỘP (lượt 1), trên đường ron dọc GẦN bức tường có
#                hộp/ba lô/túi đỏ nhất. Chân tường đó ở y ~ -0.50 m.
#   x: dọc hành lang, dương về phía cam02.  y: ngang hành lang, dương đi ra xa bức tường đó.
#   Hành lang rộng ~2.4 viên ~ 1.6 m (ước từ ảnh, cả hai camera khớp nhau ở phía tường hộp).
#
# cam03: cùng hành lang thẳng, về phía cam02, quay lưng về phía hộp. Mốc = túi đỏ đặt sát
#   cùng bức tường, cách hộp 27 viên (18.4 m, thước dây); túi nằm trên đường ron ngang hàng 0
#   của cam03 (lệch 0.08 viên). Lưới cam03: khung trung vị r3/cam03_median.png, hàng 0..6.

plane: ground
image_size: [1920, 1080]
cameras:
  cam01:
    # Đo lại 2026-10-20 (phiên 36), tư thế cuối: cam01 ngẩng lại để thấy trọn người trong vùng chồng
    # lấn (vùng xa x > 6 m lọc bằng phần mềm). Góc ron gạch: dự đoán -> cornerSubPix -> kiểm điểm
    # yên ngựa, lan từng hàng, trên data/lab/calib_frames/2026-10-20e/cam01_median.png; loại góc lệch
    # > 0.03 viên dưới mô hình méo division (k1 ~ -0.07). Mốc: cái bát đặt trên góc gạch gốc (0, 0),
    # cam02 thấy đáy bát cách điểm gốc phiên 35 < 2 px; ở cam01 bát che đúng góc đó nên góc đó bị bỏ.
    points:
      - {image: [1178.3, 975.4], world: [-1.363, 0.000]}   # hàng -2, cột 1
      - {image: [796.7, 904.2], world: [-1.363, 0.681]}   # hàng -2, cột 0
