# Topology cho dataset WildTrack: 7 camera cùng nhìn một quảng trường, đôi một chồng lấn.
# Chỉ dùng để thử engine — KHÔNG phải hệ thống camera thật của đồ án.
#
# Bản dựng bằng code của cùng đồ thị này nằm ở `eval/eval_wildtrack.overlapping_topology()`;
# file này là để chạy `python -m mct` (CLI cần một đường dẫn thật).
# THIẾU file này thì thành phần hình học bị bỏ qua HOÀN TOÀN và im lặng —
# 2800 message ra 42 Global ID thay vì 321. Xem worklog 2026-09-04-6.

cameras:
