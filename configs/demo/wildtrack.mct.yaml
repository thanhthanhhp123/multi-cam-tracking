# Tham số engine ĐÃ TINH CHỈNH cho dataset WildTrack — dùng để demo dashboard và để
# tái lập số đo trong docs/worklog/2026-09-04-5-*.md (F1 0.929 ở chế độ online).
#
# KHÔNG phải cấu hình của hệ thống thật: configs/mct.yaml mới là cái đó. Khác biệt
# chính là max_cost 0.60 và ground_gap_policy=reject — chỉ đúng khi MỌI cặp camera
# đều chồng lấn và đã hiệu chỉnh homography, đúng đặc thù WildTrack.
#
#   python -m mct --config configs/demo/wildtrack.mct.yaml
#       --source data/fixtures/wildtrack_7cam.jsonl
#       --topology configs/demo/wildtrack.topology.yaml
#       --homography-dir configs/cameras/homography/wildtrack --publish

tracklet:
  min_frames: 3
  # idle_timeout_ms PHỤ THUỘC FRAME RATE. Ở 2 fps của WildTrack, 2000 ms chỉ là 4 khung —
  # hụt 4 detection liên tiếp (rất thường khi người bị che) là tracklet bị chẻ đôi. Đo
  # 2026-09-04 trên fixture do pipeline DeepStream sinh ra: 345 local track bị bộ dựng
  # tracklet cắt thành 550 tracklet, và trần recall của ground_gap_policy=reject chỉ còn
  # 13.8%. Nâng lên 30000 ms thì hết cắt thêm (345 -> 345) và trần lên 34.5%.
  # Giữ 2000 ở đây để tái lập số đo phiên 5 trên fixture cũ; chốt lại ở M6 với dữ liệu
  # 25 fps tự thu. Xem docs/worklog/2026-09-04-12-* và eval/diagnose_tracklets.py.
  idle_timeout_ms: 2000
  max_embeddings: 32
  ground_path_max_points: 64
gallery:
  max_size: 32
  topk_query: 8
  ema_alpha: 0.3
  similarity_mode: max
association:
  window_ms: 1000
  max_cost: 0.60
  homography_weight: 0.4
  # Chỉnh trên fixture có bbox GT, nơi điểm chân gần như tuyệt đối (d_ground giữa hai
  # tracklet cùng người có trung vị 0.05 m). Với hộp của detector con số đó là 0.97 m —
  # tức NẰM SÁT ngưỡng 1.0 này, hơn nửa số cặp đúng bị loại oan. Đo 2026-09-04: 3.0 m cho
  # qua 53.1% cặp đúng mà chỉ lọt 2.2% cặp sai (so với 34.5% / 0.2% ở 1.0 m).
  max_ground_dist_m: 1.0
  ground_time_tol_ms: 400
  max_speed_m_s: 2.5
  ground_gap_policy: reject
  global_track_ttl_ms: 120000
store:
  db_path: data/mct-wildtrack.db
  batch_size: 64
  flush_interval_ms: 1000
